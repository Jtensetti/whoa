name: Crawl Whoa and export search for Sites
on:
  push:
    branches: [main]
    paths: ['main.py', 'build_static.py', 'export_index.py', 'whoa_parser.py', 'publish_index.py', 'web/**', '.github/workflows/archive.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: whoa-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore persistent crawl database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download archive-state --pattern 'whoa.db.gz' --clobber
          gzip -dc whoa.db.gz > whoa.db
      - name: Crawl public pages slowly
        id: crawl
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[export-only]')
        continue-on-error: true
        env:
          WHOA_DB: whoa.db
          CRAWL_DELAY: '3'
          CRAWL_BATCH: '1000000'
          CRAWL_SECONDS: '2700'
          CONTACT_URL: https://github.com/Jtensetti/whoa/issues
        run: python -c "from main import crawl_batch; crawl_batch()"
      - name: Save resumable checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('whoa.db')
          db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          print('Saved pages:',db.execute('SELECT COUNT(*) FROM pages').fetchone()[0])
          db.close()
          PY
          gzip -c -9 whoa.db > whoa.db.gz
          gh release upload archive-state whoa.db.gz --clobber
      - name: Build importable archive
        run: |
          python build_static.py
          python export_index.py
          npx --yes pagefind@1.4.0 --site dist --glob 'post/**/*.html'
      - name: Publish immutable index for Sites
        run: python publish_index.py
      - name: Export Site import bundle
        uses: actions/upload-artifact@v4
        with:
          name: whoa-search-import
          path: |
            dist/
            diagnostics/
            whoa.db.gz
          retention-days: 30
      - name: Report crawler failure
        if: steps.crawl.outcome == 'failure'
        run: exit 1
